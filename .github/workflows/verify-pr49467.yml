name: verify-pr49467

# Independent on-hardware test of transformers PR #49467 ("Update
# metal quant kernels", the maintainer's kernel-side fix for #49337):
# same pairing as verify-torch214-26.yml (macos-26 + torch 2.10.0 +
# kernels 0.18.3, the one window where MPS, the kernel variants and
# the OS floor all open), but transformers is installed from the PR
# branch and the check applies no transformers-side fix of its own.

on:
  workflow_dispatch:

jobs:
  verify-pr:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the machine
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string || true

      - name: Install torch 2.10.0, kernels, transformers from PR #49467 branch (single resolve)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.10.0 kernels==0.18.3 "transformers @ git+https://github.com/huggingface/transformers@fix-metal-linear-nd-input"

      - name: Probe MPS / Metal availability
        run: |
          python3 - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("mps built:", torch.backends.mps.is_built())
          print("mps available:", torch.backends.mps.is_available())
          PY

      - name: Diagnose the transformers kernel-load path (exact lazy call, full traceback)
        run: |
          python3 - <<'PY' || true
          import logging, traceback
          logging.basicConfig(level=logging.INFO)
          import torch
          print("torch:", torch.__version__)
          # 1) The exact call transformers' lazy_load_kernel makes for this PR.
          try:
              from transformers.integrations.hub_kernels import get_kernel as tf_get_kernel
              k = tf_get_kernel("kernels-community/mlx-quantization-metal-kernels", version=2, allow_all_kernels=False)
              print("transformers get_kernel v2 OK:", sorted(n for n in dir(k) if not n.startswith("_"))[:25])
          except Exception:
              print("transformers get_kernel v2 FAILED:")
              traceback.print_exc()
          # 2) The lazy path itself, as MetalLinear.forward invokes it.
          try:
              from transformers.integrations.hub_kernels import lazy_load_kernel
              m = lazy_load_kernel("mlx-quantization")
              print("lazy_load_kernel ->", "None (load failed, exception swallowed)" if m is None else "module loaded")
          except Exception:
              print("lazy_load_kernel RAISED:")
              traceback.print_exc()
          # 3) Variant inventory against this environment, with rejection reasons.
          try:
              from kernels import get_kernel_variants, VariantAccepted
              for d in get_kernel_variants("kernels-community/mlx-quantization-metal-kernels", version=2):
                  v = d.variant.variant_str
                  print("variant", v, "->", "ACCEPTED" if isinstance(d, VariantAccepted) else f"rejected ({d.reason})")
          except Exception:
              print("variant inventory FAILED:")
              traceback.print_exc()
          PY

      - name: Run the PR check (full output to verify-pr49467.log)
        run: |
          set -o pipefail
          python3 verify_pr49467.py 2>&1 | tee verify-pr49467.log

      - name: Diagnose kernel load (surface the real exception)
        if: always()
        run: |
          python3 - <<'PY' || true
          import traceback
          try:
              from kernels import get_kernel
              k = get_kernel("kernels-community/mlx-quantization-metal-kernels", version=2)
              print("kernel v2 loaded:", [n for n in dir(k) if not n.startswith("_")])
          except Exception:
              traceback.print_exc()
          PY

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pr49467-log
          path: verify-pr49467.log
