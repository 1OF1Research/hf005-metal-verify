name: verify-hf005

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the machine
        run: |
          uname -a
          python3 -c "import platform; print(platform.machine(), platform.platform())"

      - name: Install torch, kernels, transformers (main, as in the issue repro)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.15.0 kernels==0.18.3
          python3 -m pip install "transformers @ git+https://github.com/huggingface/transformers@main"

      - name: Probe MPS / Metal availability
        run: |
          python3 - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("mps built:", torch.backends.mps.is_built())
          print("mps available:", torch.backends.mps.is_available())
          PY

      - name: Run the verification (full output to verify.log)
        run: |
          set -o pipefail
          python3 verify_hf005.py 2>&1 | tee verify.log

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
