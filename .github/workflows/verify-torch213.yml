name: verify-hf005-torch213

# HF-005 wall retest, step 4: one step down from 2.14.
# The torch 2.14.0 run (43672334479) cleared the MPS gate (available:
# True) and the torch-version gate, and stopped at a third gate in
# the resolver's own words: "torch214-metal-aarch64-darwin: Metal
# kernels require macOS 26.0 or later, system macOS version is
# 15.8.2". The macos-15 runner is macOS 15.8.2, so the full
# verification needs the newest kernel-v1 variant without that OS
# floor. torch 2.13.0 is next: its MPS execution on this exact
# runner is already proven (probe matrix run 43672200354: available
# True, real op result 8.0), and its variant exists at the pinned
# kernel revision. transformers==5.23.0 as before — its
# metal_quantization.py is byte-identical to main
# (md5 a8220e467a5cf41f8febf10b3f74cde3), fault present.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the machine
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          python3 -c "import platform; print(platform.machine(), platform.platform())"

      - name: Install torch 2.13.0, kernels, transformers 5.23.0 (single resolve)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.13.0 kernels==0.18.3 transformers==5.23.0

      - name: Probe MPS / Metal availability
        run: |
          python3 - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("mps built:", torch.backends.mps.is_built())
          print("mps available:", torch.backends.mps.is_available())
          PY

      - name: Run the verification (full output to verify-torch213.log)
        run: |
          set -o pipefail
          python3 verify_hf005.py 2>&1 | tee verify-torch213.log

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-torch213-log
          path: verify-torch213.log
